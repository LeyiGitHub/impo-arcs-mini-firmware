# USB-powered Yunbao voice box; no robot-dog peripherals.
CONFIG_BOARD_ARCS_MINI_YUNBAO=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_UART1=n
CONFIG_LISA_UART2=n
CONFIG_LISA_PWM=n
CONFIG_LISA_I2C=n
CONFIG_LISA_SDMMC_DEVICE=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_LISA_CAMERA_DEVICE=n
CONFIG_LISA_DVP_DEVICE=n
CONFIG_LISA_TOUCH_DEVICE=n
CONFIG_LISA_DISPLAY_DEVICE=n
CONFIG_GADGET_NODE_PREFIX="yunbao"
CONFIG_GADGET_DISPLAY_NAME="云宝"
CONFIG_GADGET_MODEL_ID="arcs-mini-yunbao"
